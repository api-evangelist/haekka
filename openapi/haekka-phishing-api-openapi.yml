components:
  schemas:
    PhishingTemplate:
      required:
      - name
      - preview_image_url
      - html_url
      - sender_email_address
      - category
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        application:
          title: Application
          type:
          - string
          - 'null'
          maxLength: 30
        name:
          title: Name
          type: string
          maxLength: 255
          minLength: 1
        icon:
          title: Icon
          type:
          - string
          - 'null'
          maxLength: 255
        preview_image_url:
          title: Preview image url
          type: string
          maxLength: 255
          minLength: 1
        html_url:
          title: Html url
          type: string
          maxLength: 255
          minLength: 1
        active:
          title: Active
          type: boolean
        sender_email_address:
          title: Sender email address
          type: string
          maxLength: 255
          minLength: 1
        category:
          $ref: '#/components/schemas/PhishingTemplateCategory'
    PhishingForwardedNotificationEmailToIMAPCredentialsMapping:
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        company:
          title: Company
          type: string
          format: uuid
          readOnly: true
        email:
          title: Email
          type: string
          readOnly: true
          minLength: 1
        decrypted_password:
          title: Decrypted password
          type: string
          readOnly: true
    PhishingTemplateCategory:
      required:
      - name
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        name:
          title: Name
          type: string
          maxLength: 50
          minLength: 1
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
