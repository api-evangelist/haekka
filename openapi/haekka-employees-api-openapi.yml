  /api/employees/login:
    parameters: []
    post:
      operationId: LoginSlackUserOrCreatesOne
      description: 'This endpoint does slack login user matching process.

        You must execute this endpoint FIRST TIME you enter on APP.

        All fields are required.

        Later, You must include in all calls Header:


        Slack-User-Id: slack_user_id__slack_user_company


        (example) AAAAAAA__BBBBBB


        OR IF YOU PREFER you can include two params


        Slack-Uid: AAAAAAA


        Slack-Cid: BBBBBBB


        And let the middleware makes all happens.'
      responses:
        '200':
          description: response description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeLogin'
        '400':
          description: Bad Request
      tags:
      - Employees
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                slack_user_id:
                  description: Slack User ID
                  type: string
                slack_user_name:
                  description: Slack User Name
                  type: string
                slack_user_email:
                  description: Slack User Email
                  type: string
                slack_company_id:
                  description: Slack Company ID
                  type: string
                slack_company_title:
                  description: Slack Company name
                  type: string
        required: true
      summary: Login slack user or creates one
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Login slack user or creates one
  /api/employees/login/google:
