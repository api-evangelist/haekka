          - string
          - 'null'
          format: uuid
        image_name:
          title: Image Name
          type:
          - string
          - 'null'
          maxLength: 200
        image_url:
          title: Image url
          type:
          - string
          - 'null'
          readOnly: true
          format: uri
        image_url_public:
          title: Image url public
          type:
          - string
          - 'null'
          readOnly: true
          format: uri
        editor_content:
          title: Editor Content
          type:
          - string
          - 'null'
          format: uuid
        content_type:
          title: Content Type
          type:
          - string
          - 'null'
          enum:
          - lesson
          - quiz
          - engagement_question
          - engagement_message
          - assessment_question_content
    EngagementWelcomeMessage:
      required:
      - editor_content
      - engagement
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        editor_content:
          $ref: '#/components/schemas/RichTextEditorState'
        created:
          title: Created date
          type: string
          format: date-time
          readOnly: true
        modified:
          title: Modified date
          type: string
          format: date-time
          readOnly: true
        enabled:
          title: Enabled
          type: boolean
        slack_markup:
          title: Slack Markup
          type:
          - string
          - 'null'
        button_text:
          title: Button text
          type: string
          maxLength: 50
          minLength: 1
        polymorphic_ctype:
          title: Polymorphic ctype
          type: integer
          readOnly: true
        engagement:
          title: Engagement
          type: string
          format: uuid
    CustomEngagementQuestionVideo:
      required:
      - name
      - progress
      - thumbnail
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        engagement_question:
          title: Engagement
          type:
          - string
          - 'null'
          format: uuid
        service_id:
          title: Service ID
          type: integer
          readOnly: true
        name:
          title: Video Title
          type: string
          maxLength: 300
          minLength: 1
        duration:
          title: Duration
          type: integer
          readOnly: true
        hashed_id:
          title: Hashed id
          type: string
          readOnly: true
        progress:
          title: Progress
          type: string
          format: decimal
        thumbnail:
