            $ref: '#/components/schemas/CustomEngagementQuestionVideo'
        created:
          title: Created date
          type: string
          format: date-time
          readOnly: true
        modified:
          title: Modified date
          type: string
          format: date-time
          readOnly: true
        position:
          title: Position order
          type: integer
          maximum: 32767
          minimum: -32768
        answer_type:
          title: Answer type
          type:
          - string
          - 'null'
          enum:
          - no_action
          - user_acknowledged
          - multiple_choice
          - neutral
          - written_response
          - external_url
        external_url:
          title: External URL
          type:
          - string
          - 'null'
          format: uri
          maxLength: 200
        external_url_btn_text:
          title: External URL button text
          type:
          - string
          - 'null'
        single_select:
          title: Single select
          type: boolean
        quiz:
          title: Quiz
          type: string
          format: uuid
          readOnly: true
    RichTextEditorState:
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
        editor_state:
          title: Stringified Editor state
          type:
          - string
          - 'null'
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContentImage'
    Owner:
      required:
      - id
      - name
