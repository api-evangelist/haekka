components:
  schemas:
    SeismicContent:
      required:
      - resource_type
      - id
      - title
      - is_certification
      type: object
      properties:
        resource_type:
          title: Resource type
          type: string
          minLength: 1
        id:
          title: Id
          type: integer
        title:
          title: Title
          type: string
          minLength: 1
        is_certification:
          title: Is certification
          type: boolean
    ExternalAppPolymorphic:
      type: object
      properties: {}
    SeismicContentList:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SeismicContent'
    DoceboCourseList:
      required:
      - items
      - count
      - has_more_data
      - current_page
      - total_count
      - total_page_count
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DoceboCourseItem'
        count:
          title: Count
          type: integer
        has_more_data:
          title: Has more data
          type: boolean
        current_page:
          title: Current page
          type: integer
        total_count:
          title: Total count
          type: integer
        total_page_count:
          title: Total page count
          type: integer
    DoceboCourseItem:
      required:
      - id
      - code
      - uidCourse
      - title
      - type
      type: object
      properties:
        id:
          title: Id
          type: string
          minLength: 1
        code:
          title: Code
          type: string
          minLength: 1
        uidCourse:
          title: Uidcourse
          type: string
          minLength: 1
        title:
          title: Title
          type: string
          minLength: 1
        type:
          title: Type
          type: string
          minLength: 1
    GoogleGroupsList:
      required:
      - groups
      type: object
      properties:
        groups:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GoogleGroup'
        next_page_token:
          title: Next page token
          type: string
          minLength: 1
    GoogleGroup:
      required:
      - id
      - email
      - name
      - direct_members_count
      - description
      type:
      - object
      - 'null'
      properties:
        id:
          title: Id
          type: string
          minLength: 1
        email:
          title: Email
          type: string
          minLength: 1
        name:
          title: Name
          type: string
          minLength: 1
        direct_members_count:
          title: Direct members count
          type: string
          minLength: 1
        description:
          title: Description
          type: string
          minLength: 1
    ExternalAppWebhookConfigResponse:
      required:
      - success
      type: object
      properties:
        success:
          title: Success
          type: boolean
        messages:
          type: array
          items:
            type: string
            minLength: 1
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
