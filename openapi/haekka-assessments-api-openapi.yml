components:
  schemas:
    editor_state_in_question_serializers:
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
        note_editor_state:
          title: Stringified note Editor's content
          type:
          - string
          - 'null'
        summary_editor_state:
          title: Stringified summary Editor's content
          type:
          - string
          - 'null'
        question_editor_state:
          title: Stringified question Editor's content
          type:
          - string
          - 'null'
        quiz_editor_state:
          title: Stringified quiz Editor's content
          type:
          - string
          - 'null'
        quiz_message_state:
          title: Stringified quiz message Editor's content
          type:
          - string
          - 'null'
        content:
          type: array
          items:
            $ref: '#/components/schemas/lesson_image_in_question_serializers'
    lesson_image_in_question_serializers:
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        company:
          title: Company
          type:
          - string
          - 'null'
          format: uuid
        image_name:
          title: Image Name
          type:
          - string
          - 'null'
          maxLength: 200
        image_url:
          title: Image url
          type:
          - string
          - 'null'
          readOnly: true
          format: uri
        image_url_public:
          title: Image url public
          type:
          - string
          - 'null'
          readOnly: true
          format: uri
        editor_content:
          title: Editor Content
          type:
          - string
          - 'null'
          format: uuid
        content_type:
          title: Content Type
          type:
          - string
          - 'null'
          enum:
          - lesson
          - quiz
          - engagement_question
          - engagement_message
          - assessment_question_content
    AssessmentAnswer:
      required:
      - answer
      type: object
      properties:
        id:
          title: Id
          type:
          - string
          - 'null'
          format: uuid
        answer:
          title: Answer
          description: "You must use the Slack nomenclature for the markdown,\n        for more info visit: https://api.slack.com/reference/surfaces/formatting"
          type: string
          maxLength: 150
          minLength: 1
        correct:
          title: Correct
          type:
          - boolean
          - 'null'
        position:
          title: Order
          type: integer
          maximum: 32767
          minimum: -32768
        explanation:
          title: Answer Explanation
          type:
          - string
          - 'null'
    AssessmentQuestion:
      type: object
      properties:
        id:
          title: Id
          type:
          - string
          - 'null'
          format: uuid
        position:
          title: Position
          type: integer
          maximum: 32767
          minimum: -32768
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentAnswer'
        editor_content:
          $ref: '#/components/schemas/editor_state_in_question_serializers'
        image_ids:
          type: array
          items:
            type:
            - string
            - 'null'
        slack_markup:
          title: Slack markup
          type: string
          readOnly: true
        single_select:
          title: Single select
          type: boolean
        single_correct:
          title: Single correct
          type: boolean
    AssessmentQuestionWrite:
      required:
      - slack_markup
      type:
      - object
      - 'null'
      properties:
        id:
          title: Id
          type:
          - string
          - 'null'
          format: uuid
        position:
          title: Position
          type: integer
          maximum: 32767
          minimum: -32768
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentAnswer'
        editor_content:
          $ref: '#/components/schemas/editor_state_in_question_serializers'
        image_ids:
          type: array
          items:
            type:
            - string
            - 'null'
        slack_markup:
          title: Slack markup
          type: string
          minLength: 1
        single_select:
          title: Single select
          type: boolean
        single_correct:
          title: Single correct
          type: boolean
    AssessmentSerializerWrite:
      required:
      - title
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        questions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AssessmentQuestionWrite'
        created:
          title: Created date
          type: string
          format: date-time
          readOnly: true
        modified:
          title: Modified date
          type: string
          format: date-time
          readOnly: true
        title:
          title: Assessment Title
          type: string
          maxLength: 200
          minLength: 1
        company:
          title: Company
          type:
          - string
          - 'null'
          format: uuid
    TrainingCompanyAssessment:
      required:
      - assessment
      - company
      - curriculum
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        assessment:
          $ref: '#/components/schemas/Assessment'
        created:
          title: Created date
          type: string
          format: date-time
          readOnly: true
        modified:
          title: Modified date
          type: string
          format: date-time
          readOnly: true
        passing_grade:
          title: Passing grade
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        retake_status:
          title: Retake status
          type: string
          enum:
          - optional
          - force_retake
          - force_continue
        is_active:
          title: Is active
          type: boolean
        position:
          title: Position
          type: integer
          maximum: 32767
          minimum: -32768
        polymorphic_ctype:
          title: Polymorphic ctype
          type: integer
          readOnly: true
        company:
          title: Company
          type: string
          format: uuid
        created_by:
          title: Created by
          type:
          - string
          - 'null'
          format: uuid
        curriculum:
          title: Curriculum
          type: string
          format: uuid
        lessons_to_skip:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
    TrainingCompanyAssessmentWrite:
      required:
      - company
      - curriculum
      - assessment
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        created:
          title: Created date
          type: string
          format: date-time
          readOnly: true
        modified:
          title: Modified date
          type: string
          format: date-time
          readOnly: true
        passing_grade:
          title: Passing grade
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        retake_status:
          title: Retake status
          type: string
          enum:
          - optional
          - force_retake
          - force_continue
        is_active:
          title: Is active
          type: boolean
        position:
          title: Position
          type: integer
          maximum: 32767
          minimum: -32768
        polymorphic_ctype:
          title: Polymorphic ctype
          type: integer
          readOnly: true
        company:
          title: Company
          type: string
          format: uuid
        created_by:
          title: Created by
          type:
          - string
          - 'null'
          format: uuid
        curriculum:
          title: Curriculum
          type: string
          format: uuid
        assessment:
          title: Assessment
          type: string
          format: uuid
        lessons_to_skip:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
    Assessment:
      required:
      - questions
      - title
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentQuestion'
        created:
          title: Created date
          type: string
          format: date-time
          readOnly: true
        modified:
          title: Modified date
          type: string
          format: date-time
          readOnly: true
        title:
          title: Assessment Title
          type: string
          maxLength: 200
          minLength: 1
        company:
          title: Company
          type:
          - string
          - 'null'
          format: uuid
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
