  /api/public/status:
    parameters: []
    get:
      operationId: api_public_status_list
      description: ''
      responses:
        '200':
          description: ''
      tags:
      - Public
      summary: Api public status list
      x-summary-source: derived
  /api/public/trainings/:
    parameters: []
    get:
      operationId: TrainingList
      description: Returns all trainings going on at the moment in the your company.
      parameters:
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicTraining'
      tags:
      - Public
      summary: Training list
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Training List
  /api/public/trainings/assign/:
    parameters: []
    post:
      operationId: TrainingAssign
      description: Assigns a training to employees
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTrainingAssign'
      tags:
