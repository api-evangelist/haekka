        required: true
      summary: Api public phishing record create
      x-summary-source: derived
  /api/public/phishing/redirect/{employee_id}/{campaign_id}/{campaign_attack_id}:
    parameters:
    - name: campaign_attack_id
      in: path
      required: true
      schema:
        type: string
    - name: campaign_id
      in: path
      required: true
