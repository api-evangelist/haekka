paths:
  /api/public/employee_trainings/:
    parameters: []
    get:
      operationId: EmployeeTrainingList
      description: 'List all employee training objects. Employee Training object represents

        assignement of a training to an employee.


        If you want to fetch only assigned trainings to one particular employee,

        you can use the `employee_id` query parameter.


        Or if you want to see all employees assigned to a particulat training,

        you can use the `training_id` query parameter.'
      parameters:
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: employee_id
        in: query
        description: Employee ID
        schema:
          type: string
      - name: training_id
        in: query
        description: Training ID
        schema:
          type: string
      - name: employee_name
        in: query
        description: Employee Name
        schema:
          type: string
      - name: training_name
        in: query
        description: Training Name
        schema:
          type: string
      - name: completion_status
        in: query
        description: Employee Training Completion Status
        schema:
          type: boolean
      - name: year
        in: query
        description: Employee Training Year
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicEmployeeTraining'
      tags:
      - Public
      summary: Employee training list
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Employee Training List
  /api/public/employee_trainings/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: EmployeeTrainingRetrieve
      description: ''
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmployeeTraining'
      tags:
      - Public
      summary: Employee training retrieve
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Employee Training Retrieve
    put:
      operationId: api_public_employee_trainings_update
      description: ''
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmployeeTraining'
      tags:
      - Public
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicEmployeeTraining'
        required: true
      summary: Api public employee trainings update
      x-summary-source: derived
    patch:
      operationId: EmployeeTrainingUpdate
      description: Update an employee training object. Currently we only support completion status and completion rate update.
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEmployeeTraining'
      tags:
      - Public
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicEmployeeTraining'
        required: true
      summary: Employee training update
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Employee Training Update
  /api/public/employees/:
    parameters: []
    get:
      operationId: EmployeeList
      description: 'Returns data about employees withing your company that could be

        useful for finding out more information about their training status.'
      parameters:
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicEmployeeList'
      tags:
      - Public
      summary: Employee list
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Employee List
  /api/public/employees/{id}/:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: EmployeeRetrieve
      description: ''
      responses:
        '200':
          description: ''
