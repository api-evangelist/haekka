components:
  schemas:
    CurriculumTag:
      required:
      - name
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        created:
          title: Created date
          type: string
          format: date-time
          readOnly: true
        modified:
          title: Modified date
          type: string
          format: date-time
          readOnly: true
        name:
          title: Curriculum tag name
          type: string
          maxLength: 60
          minLength: 1
    editor_state_in_question_serializers:
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
        note_editor_state:
          title: Stringified note Editor's content
          type:
          - string
          - 'null'
        summary_editor_state:
          title: Stringified summary Editor's content
          type:
          - string
          - 'null'
        question_editor_state:
          title: Stringified question Editor's content
          type:
          - string
          - 'null'
        quiz_editor_state:
          title: Stringified quiz Editor's content
          type:
          - string
          - 'null'
        quiz_message_state:
          title: Stringified quiz message Editor's content
          type:
          - string
          - 'null'
        content:
          type: array
          items:
            $ref: '#/components/schemas/lesson_image_in_question_serializers'
    lesson_image_in_question_serializers:
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        company:
          title: Company
          type:
          - string
          - 'null'
          format: uuid
        image_name:
          title: Image Name
          type:
          - string
          - 'null'
          maxLength: 200
        image_url:
          title: Image url
          type:
          - string
          - 'null'
          readOnly: true
          format: uri
        image_url_public:
          title: Image url public
          type:
          - string
          - 'null'
          readOnly: true
          format: uri
        editor_content:
          title: Editor Content
          type:
          - string
          - 'null'
          format: uuid
        content_type:
          title: Content Type
          type:
          - string
          - 'null'
          enum:
          - lesson
          - quiz
          - engagement_question
          - engagement_message
          - assessment_question_content
    AssessmentAnswer:
      required:
      - answer
      type: object
      properties:
        id:
          title: Id
          type:
          - string
          - 'null'
          format: uuid
        answer:
          title: Answer
          description: "You must use the Slack nomenclature for the markdown,\n        for more info visit: https://api.slack.com/reference/surfaces/formatting"
          type: string
          maxLength: 150
          minLength: 1
        correct:
          title: Correct
          type:
          - boolean
          - 'null'
        position:
          title: Order
          type: integer
          maximum: 32767
          minimum: -32768
        explanation:
          title: Answer Explanation
          type:
          - string
          - 'null'
    Curriculum:
      required:
      - title
      - subtitle
      - curriculum_type
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        title:
          title: Training Title
          type: string
          maxLength: 150
          minLength: 1
        subtitle:
          title: Training Subtitle
          type: string
          maxLength: 255
          minLength: 1
        company:
          title: Company
          type: string
          format: uuid
          readOnly: true
        curriculum_type:
          title: Category
          type: string
          format: uuid
        training_sample:
          title: Training Sample URL
          type:
          - string
          - 'null'
          format: uri
          maxLength: 200
        is_technical:
          title: Is technical
          type: boolean
        is_archived:
          title: Is archived
          type: boolean
        is_published:
          title: Is published
          type: boolean
        is_editable:
          title: Is editable
          type: boolean
          readOnly: true
        author_name:
          title: Author name
          type: string
          readOnly: true
        author_icon_url:
          title: Author Icon URL
          type:
          - string
          - 'null'
          maxLength: 255
        is_already_in_use:
          title: Is already in use
          type: string
          readOnly: true
        active_training_id:
          title: Active training id
          type: string
          readOnly: true
        is_available_for_free:
          title: Is available for free
          type: boolean
        curriculum_type_details:
          $ref: '#/components/schemas/CurriculumType'
        action_id:
          title: Answer Action Id
          type: string
          enum:
          - lesson_submit
          - branching
        includes_video:
          title: Includes video
          type: string
          readOnly: true
        average_length:
          title: Average length
          type: string
          readOnly: true
    CurriculumContent:
      required:
      - assessments
      type: object
      properties:
        lessons:
          title: Lessons
          type: string
          readOnly: true
        assessments:
          type: array
          items:
            $ref: '#/components/schemas/TrainingCompanyAssessment'
    AssessmentQuestion:
      type: object
      properties:
        id:
          title: Id
          type:
          - string
          - 'null'
          format: uuid
        position:
          title: Position
          type: integer
          maximum: 32767
          minimum: -32768
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentAnswer'
        editor_content:
          $ref: '#/components/schemas/editor_state_in_question_serializers'
        image_ids:
          type: array
          items:
            type:
            - string
            - 'null'
        slack_markup:
          title: Slack markup
          type: string
          readOnly: true
        single_select:
          title: Single select
          type: boolean
        single_correct:
          title: Single correct
          type: boolean
    CurriculumType:
      required:
      - name
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        name:
          title: Curriculum type name
          type: string
          maxLength: 60
          minLength: 1
        titles:
          title: Titles
          type: string
          readOnly: true
    GlobalCurriculum:
      required:
      - title
      - subtitle
      - curriculum_type
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        title:
          title: Training Title
          type: string
          maxLength: 150
          minLength: 1
        subtitle:
          title: Training Subtitle
          type: string
          maxLength: 255
          minLength: 1
        company:
          title: Company
          type: string
          format: uuid
          readOnly: true
        curriculum_type:
          title: Category
          type: string
          format: uuid
        training_sample:
          title: Training Sample URL
          type:
          - string
          - 'null'
          format: uri
          maxLength: 200
        is_technical:
          title: Is technical
          type: boolean
        is_archived:
          title: Is archived
          type: boolean
        is_published:
          title: Is published
          type: boolean
        is_editable:
          title: Is editable
          type: boolean
        is_available_for_free:
          title: Is available for free
          type: boolean
        action_id:
          title: Answer Action Id
          type: string
          enum:
          - lesson_submit
          - branching
        author_name:
          title: Author Name
          type:
          - string
          - 'null'
          maxLength: 255
        author_icon_url:
          title: Author Icon URL
          type:
          - string
          - 'null'
          maxLength: 255
        tags:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CurriculumTag'
          readOnly: true
    CurriculumTypeWithoutTitles:
      required:
      - name
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        name:
          title: Curriculum type name
          type: string
          maxLength: 60
          minLength: 1
    TrainingCompanyAssessment:
      required:
      - assessment
      - company
      - curriculum
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        assessment:
          $ref: '#/components/schemas/Assessment'
        created:
          title: Created date
          type: string
          format: date-time
          readOnly: true
        modified:
          title: Modified date
          type: string
          format: date-time
          readOnly: true
        passing_grade:
          title: Passing grade
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        retake_status:
          title: Retake status
          type: string
          enum:
          - optional
          - force_retake
          - force_continue
        is_active:
          title: Is active
          type: boolean
        position:
          title: Position
          type: integer
          maximum: 32767
          minimum: -32768
        polymorphic_ctype:
          title: Polymorphic ctype
          type: integer
          readOnly: true
        company:
          title: Company
          type: string
          format: uuid
        created_by:
          title: Created by
          type:
          - string
          - 'null'
          format: uuid
        curriculum:
          title: Curriculum
          type: string
          format: uuid
        lessons_to_skip:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
    Assessment:
      required:
      - questions
      - title
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentQuestion'
        created:
          title: Created date
          type: string
          format: date-time
          readOnly: true
        modified:
          title: Modified date
          type: string
          format: date-time
          readOnly: true
        title:
          title: Assessment Title
          type: string
          maxLength: 200
          minLength: 1
        company:
          title: Company
          type:
          - string
          - 'null'
          format: uuid
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
