components:
  schemas:
    StreamPostCategory:
      required:
      - title
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
        title:
          title: Title
          type: string
          maxLength: 60
          minLength: 1
    Stream:
      required:
      - title
      - icon_url
      - description
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        company:
          title: Company
          type:
          - string
          - 'null'
          format: uuid
        title:
          title: Title
          type: string
          maxLength: 300
          minLength: 1
        icon_url:
          title: Icon URL
          type: string
          maxLength: 300
          minLength: 1
        description:
          title: Description
          type: string
          minLength: 1
        is_free:
          title: Is Free Stream
          type: boolean
    RichTextEditorState:
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
        editor_state:
          title: Stringified Editor state
          type:
          - string
          - 'null'
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContentImage'
    ContentImage:
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        company:
          title: Company
          type:
          - string
          - 'null'
          format: uuid
        image_name:
          title: Image Name
          type:
          - string
          - 'null'
          maxLength: 200
        image_url:
          title: Image url
          type:
          - string
          - 'null'
          readOnly: true
          format: uri
        image_url_public:
          title: Image url public
          type:
          - string
          - 'null'
          readOnly: true
          format: uri
        editor_content:
          title: Editor Content
          type:
          - string
          - 'null'
          format: uuid
    StreamPostWrite:
      required:
      - title
      - stream
      - post_content
      - editor_content
      - stream_post_category
      type: object
      properties:
        title:
          title: Title
          type: string
          maxLength: 300
          minLength: 1
        stream:
          title: Parent Stream
          type: string
          format: uuid
        video_url:
          title: Video ULR
          type:
          - string
          - 'null'
          maxLength: 300
        post_content:
          title: Post content
          type: string
          minLength: 1
        editor_content:
          $ref: '#/components/schemas/RichTextEditorState'
        send_to_admins_only:
          title: Send To Admins Only
          type: boolean
        send_time:
          title: Send time
          type:
          - string
          - 'null'
          format: date-time
        send_now:
          title: Send Now
          type: boolean
        is_sent:
          title: Is Sent
          type: boolean
        acknowledge_button:
          title: Acknowledge Button
          type: boolean
        include_rating:
          title: Include Rating
          type: boolean
        is_editable:
          title: Is Editable (by Admins)
          type: boolean
        stream_post_category:
          $ref: '#/components/schemas/StreamPostCategory'
    StreamPost:
      required:
      - title
      - post_content
      - stream
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        category:
          $ref: '#/components/schemas/StreamPostCategory'
        editor_content:
          $ref: '#/components/schemas/RichTextEditorState'
        created:
          title: Created date
          type: string
          format: date-time
          readOnly: true
        modified:
          title: Modified date
          type: string
          format: date-time
          readOnly: true
        title:
          title: Title
          type: string
          maxLength: 300
          minLength: 1
        video_url:
          title: Video ULR
          type:
          - string
          - 'null'
          maxLength: 300
        post_content:
          title: Post content
          type: string
          minLength: 1
        send_to_admins_only:
          title: Send To Admins Only
          type: boolean
        send_time:
          title: Send time
          type:
          - string
          - 'null'
          format: date-time
        send_now:
          title: Send Now
          type: boolean
        is_sent:
          title: Is Sent
          type: boolean
        acknowledge_button:
          title: Acknowledge Button
          type: boolean
        include_rating:
          title: Include Rating
          type: boolean
        is_editable:
          title: Is Editable (by Admins)
          type: boolean
        company:
          title: Company
          type:
          - string
          - 'null'
          format: uuid
        stream:
          title: Parent Stream
          type: string
          format: uuid
        stream_post_category:
          title: Category
          type:
          - string
          - 'null'
          format: uuid
  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
