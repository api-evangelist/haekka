aid: haekka
name: Haekka
description: >-
  Haekka is a Slack-native microlearning and security-awareness training
  platform that delivers short, timely training inside Slack to improve
  knowledge, compliance, and team performance. Core products include Training,
  Streams (auto-drip microlearning), Workflows (event-triggered training
  assignment), Pulse Engagements (surveys, quizzes, announcements), and a
  Phishing simulator with a Gmail Chrome extension. Haekka's catalog maps to
  SOC 2, HIPAA, GDPR, and PCI training requirements and integrates with Slack,
  Google Workspace, and HRIS/LMS/IAM systems. Its Public REST API exposes
  employees, trainings, and employee-training completion records plus training
  assignment, secured with a bearer API key generated in account settings.
